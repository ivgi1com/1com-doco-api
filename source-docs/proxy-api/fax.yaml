reqtype: FAX
purpose: Send, list, or download faxes.
documentation: examples
category: not_documented
verification: { documented: true, implemented: false, tested: false, verified: false }
tableActions: [send, list, download]
operations:
  - id: fax.send
    title: Send a fax
    sourceAnchor: bkmrk-send-a-fax
    method:
      value: "GET or POST multipart — both shown"
      basis: [example_url, example_curl_multipart]
    discriminator: { action: send }
    observedParameters:
      - { name: tenant, example: TENANTCODE }
      - { name: number, example: "99397654321", note: "URL example only" }
      - { name: dest_number, example: "15551239999", note: "multipart example only" }
      - { name: source_number, example: "123412345 / 15551230000" }
      - { name: filename, location: multipart form file, example: "@/path/to/fax.pdf", acceptedTypes: not_documented }
    requestBody:
      encoding: multipart/form-data
      fields: [filename]
      note: "The URL-only example carries no document; how that variant supplies the fax content is not_documented."
    responses: not_documented
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=FAX&action=send&number=99397654321&source_number=123412345&tenant=TENANTCODE
      - curl -F "filename=@/path/to/fax.pdf" "https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=FAX&action=send&tenant=TENANTCODE&source_number=15551230000&dest_number=15551239999"
    notes:
      - "Destination parameter is 'number' in one example and 'dest_number' in the other. A-17"
      - "Sends to an arbitrary external number: cost impact. A-31"
  - id: fax.list
    title: List faxes
    sourceAnchor: bkmrk-list-faxes
    method: { value: GET, basis: example_url }
    discriminator: { action: list }
    observedParameters:
      - { name: tenant, example: TENANTCODE }
    requestBody: null
    responses: not_documented
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?tenant=TENANTCODE&key=APIKEY&reqtype=FAX&action=list
  - id: fax.download
    title: Get a fax binary
    sourceAnchor: bkmrk-get-a-fax-binary
    method: { value: GET, basis: example_url }
    discriminator: { action: download }
    observedParameters:
      - { name: tenant, example: TENANTCODE }
      - { name: id, example: "63095" }
    requestBody: null
    responses:
      format: "binary; content type (PDF/TIFF) not_documented"
      example: not_documented
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?tenant=TENANTCODE&key=APIKEY&reqtype=FAX&action=download&id=63095
issues: [A-02, A-03, A-05, A-16, A-17, A-31, A-37]
