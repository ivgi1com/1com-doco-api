  - id: info.simplecdrs
    title: Get the list of calls (simplified source)
    sourceAnchor: bkmrk-info---simplecdrs-%2F-
    method: { value: GET, basis: example_url }
    discriminator: { info: SIMPLECDRS }
    observedParameters:
      - { name: tenant, example: TENANTCODE }
      - { name: calleridnum, example: "103,104", meaning: "comma-separated list (from example)" }
      - { name: start, example: "2020-01-01", format: "not_documented (YYYY-MM-DD in examples)" }
      - { name: end, example: "2020-12-31" }
    requestBody: null
    responses: not_documented
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=INFO&info=SIMPLECDRS&tenant=TENANTCODE&calleridnum=103,104&start=2020-01-01&end=2020-12-31
    notes:
      - "Description says 'The phone filter searches the relevant caller, dialed, and answered number fields' (text shared with CDRS) but the example uses calleridnum, not phone. A-11"
  - id: info.cdrs
    title: Get the list of calls
    sourceAnchor: bkmrk-info---cdrs-%2F-get-th
    additionalAnchors: [bkmrk-get-the-cdr-for-a-te, bkmrk-get-the-cdr-for-all-]
    method: { value: GET, basis: example_url }
    discriminator: { info: CDRS }
    observedParameters:
      - { name: tenant, example: "TENANTCODE, or % for all tenants" }
      - { name: phone, example: "103,104" }
      - { name: start, example: "2019-12-01" }
      - { name: end, example: "2022-12-31" }
      - { name: format, example: "xml, csv" }
      - { name: template, example: Test_CSV, meaning: "name of a server-side output template (inferred from sample); not_documented" }
    requestBody: null
    responses:
      - format: template-driven
        sourceAnchor: bkmrk-info---cdrs-%2F-get-th
        description: "The 'sample output or template' is a template definition, not an output sample."
        example: |-
          {row_loop}{$uniqueid},{$ID},{$te_id},{$realsrc},{$lastdst},{$start},{$duration},{$answer},{$direction},{$direction},{$disposition}
          {/row_loop}
        notes:
          - "{$direction} appears twice; intent not_documented."
      - format: csv
        sourceAnchor: bkmrk-get-the-cdr-for-all-
        description: "One tenant: tenant CSV template is used. tenant=%: the admin CSV format is used (vendor text). Column lists not_documented."
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=INFO&info=CDRS&tenant=TENANTCODE&phone=103,104&start=2019-12-01&end=2022-12-31
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=INFO&info=CDRS&tenant=TENANTCODE&phone=103,104&start=2019-12-01&end=2022-12-31&format=xml&template=Test_CSV
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=INFO&info=CDRS&format=csv&tenant=TENANTCODE&start=2017-01-01&end=2017-02-01
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=INFO&info=CDRS&format=csv&tenant=%&start=2017-01-01&end=2017-02-01
    notes:
      - "format=xml combined with a template named Test_CSV whose body produces comma-separated text. A-24"
      - "tenant=% is a raw '%' in the URL (not percent-encoded as %25). A-23"
