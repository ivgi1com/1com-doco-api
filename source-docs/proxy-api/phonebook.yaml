reqtype: PHONEBOOK
purpose: Query, add, delete, clean, or dump phonebook records.
documentation: examples
category: not_documented
verification: { documented: true, implemented: false, tested: false, verified: false }
tableActions: [query, add, delete, clean, dump]
operations:
  - id: phonebook.query
    title: Search for an entry
    sourceAnchor: bkmrk-search-for-an-entry
    method: { value: GET, basis: example_url }
    discriminator: { subreqtype: query }
    observedParameters:
      - { name: tenant, example: TENANTCODE }
      - { name: phonebook, example: Default, meaning: "phonebook name (not id)" }
      - { name: field, example: name, allowedValues: not_documented }
      - { name: value, example: Ben, matchSemantics: "not_documented (exact / prefix / contains)" }
    requestBody: null
    responses: not_documented
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=PHONEBOOK&subreqtype=query&tenant=TENANTCODE&phonebook=Default&field=name&value=Ben
    notes:
      - "Query uses field=name (lowercase) while the add payload uses NAME/PHONE1 (uppercase); case mapping not_documented. A-08"
  - id: phonebook.add
    title: Add an entry
    sourceAnchor: bkmrk-add-an-entry
    method: { value: POST, basis: stated_jsondata }
    discriminator: { subreqtype: add }
    observedParameters:
      - { name: phonebook, example: Default }
      - { name: tenant, example: TENANTCODE }
    requestBody:
      field: jsondata
      encoding: application/x-www-form-urlencoded (JSON string in form field)
      shape: object
      observedFields: [NAME, PHONE1]
      fullFieldList: not_documented
      example: { NAME: Ross, PHONE1: "3564732920" }
    responses: not_documented
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=PHONEBOOK&subreqtype=add&phonebook=Default&tenant=TENANTCODE
uncoveredTableActions: [delete, clean, dump]
notes:
  - "The section heading is 'PHONEBOOKS' (a different reqtype: list phonebooks) but every example uses reqtype=PHONEBOOK. A-10"
  - "Discriminator is 'subreqtype', unlike 'action' elsewhere. A-07"
issues: [A-02, A-03, A-05, A-07, A-08, A-10, A-38]
