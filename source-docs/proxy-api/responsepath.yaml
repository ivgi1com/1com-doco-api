reqtype: RESPONSEPATH
purpose: Read response-path results.
documentation: examples
category: not_documented
verification: { documented: true, implemented: false, tested: false, verified: false }
tableActions: []
sectionAnchor: bkmrk-getting-response-pat
sectionNote: "Results can be filtered by queue, answering extension, or unique ID and returned as plain text or XML (vendor text). Only the answering-extension filter is exemplified."
operations:
  - id: responsepath.getlast
    title: Getting the latest one for a given Response Path
    sourceAnchor: bkmrk-getting-the-latest-o
    method: { value: GET, basis: example_url }
    discriminator: { action: GETLAST }
    observedParameters:
      - { name: tenant, example: TENANTCODE }
      - { name: id, example: "19", meaning: "response path id (from heading)" }
      - { name: filter, example: ANSWER, allowedValues: "ANSWER shown; queue / unique-ID filter values not_documented" }
      - { name: filterdata, example: 104-TENANTCODE }
      - { name: format, example: xml, allowedValues: "plain (default?) or xml per section text; default not_documented" }
    requestBody: null
    responses:
      - format: plain (pipe-delimited)
        sourceAnchor: bkmrk-getting-the-latest-o
        example: |-
          UniqueID|Type|Type ID|Value|Type Name|Value Name
          srv02-1509806457.625|START|0|2017-11-04 15:41:01||
          srv02-1509806457.625|CALLERID|0|Susan <1132555678>||
          srv02-1509806457.625|VARIABLE|85|36985||
          srv02-1509806457.625|VARIABLE|144|56896||
          srv02-1509806457.625|QUEUE|281|||
          srv02-1509806457.625|ANSWER|0|105-TENANTCODE||
          srv02-1509806457.625|HANGUP|0|||
        rowTypes: "START, CALLERID, VARIABLE, QUEUE, ANSWER, HANGUP shown; full list not_documented"
        exampleValid: true
      - format: xml
        sourceAnchor: bkmrk-getting-the-latest-o-2
        example: |-
          <?xml version="1.0">
          <Result>
          <Agent>105-TENANTCODE</Agent>
          <Status>NOT ACTIVE</Status>
          <Queue>supportQ</Queue>
          <ClientID>1234</MemberNumber>
          <OrderNumber>11223344</MemberNumber>
          <Caller>Manuel <7171345678></Caller>
          <VoiceFile>3619</VoiceFile>
          </Result>
        exampleValid: false
        exampleProblems:
          - "XML declaration missing '?' before '>'"
          - "<ClientID> and <OrderNumber> closed by </MemberNumber>"
          - "Unescaped '<' / '>' in <Caller> text"
          - "Element set (Agent/Status/ClientID/OrderNumber) does not correspond to the plain-format columns; mapping not_documented"
    errors: not_documented
    examples:
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=RESPONSEPATH&tenant=TENANTCODE&id=19&action=GETLAST
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=RESPONSEPATH&tenant=TENANTCODE&id=19&action=GETLAST&filter=ANSWER&filterdata=104-TENANTCODE
      - https://pbx.example.com/mirtapbx/proxyapi.php?key=APIKEY&reqtype=RESPONSEPATH&tenant=TENANTCODE&id=19&action=GETLAST&filter=ANSWER&filterdata=105-TENANTCODE&format=xml
    notes:
      - "Third heading says 'for agent 104-TENANTCODE' but its URL filters 105-TENANTCODE (and the XML shows 105). A-13"
      - "Only GETLAST is shown; other actions not_documented."
issues: [A-02, A-12, A-13]
