documentation: examples
category: not_documented
verification: { documented: true, implemented: false, tested: false, verified: false }
discriminatorParams: [object, action]
authentication:
  stated:
    - sourceAnchor: bkmrk-manage-db-%2F-media-fi
      quote: "ManageDB requests require an administrator API key."
    - sourceAnchor: bkmrk-security-notes
      quote: "Use administrator keys only for global reporting or MANAGEDB actions that require them."
  conflict: "First statement: all MANAGEDB requests need an admin key. Second: only some do. Most examples also pass tenant. A-18"
supportedObjects: "not enumerated; 19 object names appear in examples (below)"
supportedActions: "not enumerated per object; only exemplified actions are listed"
allOperations:
  responses: not_documented # no response sample for any MANAGEDB operation
  errors: not_documented
  methodBasis: >-
    Reads: example_url (GET reading). add/update/replace*/set*: stated_jsondata
    (POST jsondata) where a payload is shown; operations with no payload shown are
    marked. delete: example_url only — a destructive GET reading. A-06
